[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Deep Agents tutorial harness for long-running research agents with skills and reviewable workspace artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.2",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.scripts]
deep-research-agent = "deep_research_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
notebook = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
